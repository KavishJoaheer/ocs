name: Publish Docker Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: docker-publish-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Resolve tested commit
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          if [ -z "$SHA" ]; then
            echo "::error::Cannot publish without a commit SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - name: Confirm CI quality gate passed for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Publishing SHA ${SHA} after a successful CI workflow_run."
            exit 0
          fi
          conclusion="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="CI" and .event=="push")] | first | .conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish ${SHA}: CI conclusion is '${conclusion:-missing}', not success."
            exit 1
          fi

      - name: Verify Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up Buildx
        run: |
          docker buildx create --name ocs-builder --use 2>/dev/null || docker buildx use ocs-builder

      - name: Build and push main image (linux/amd64 for NAS)
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/clinicflow
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          SHORT_SHA="$(echo "${GIT_SHA}" | cut -c1-12)"
          docker buildx build \
            --platform linux/amd64 \
            --file ./Dockerfile \
            --build-arg GIT_SHA="${GIT_SHA}" \
            --build-arg APP_VERSION="${GIT_SHA}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --tag "${IMAGE}:sha-${GIT_SHA}" \
            --push \
            .

      - name: Smoke test published main image boots with expected commit
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/clinicflow:sha-${{ steps.sha.outputs.short }}
          EXPECTED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker pull "${IMAGE}"
          cid="$(docker run -d --rm -e NODE_ENV=production -e DB_PATH=/tmp/smoke.db -e SEED_USER_PASSWORD=CI-Smoke-Only-Not-For-Production "${IMAGE}")"
          trap 'docker stop "${cid}" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec -e EXPECTED_SHA="${EXPECTED_SHA}" "${cid}" node -e "fetch('http://127.0.0.1:3001/api/health').then((r)=>r.json()).then((j)=>{if(!j.ok)process.exit(1); if(!j.git_sha || j.git_sha!==process.env.EXPECTED_SHA)process.exit(2); process.exit(0);}).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy after image pull, or git_sha did not match ${EXPECTED_SHA}"
          docker logs "${cid}" || true
          exit 1

      - name: Build and push patient portal image
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/clinicflow-patient-portal
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          SHORT_SHA="$(echo "${GIT_SHA}" | cut -c1-12)"
          docker buildx build \
            --platform linux/amd64 \
            --file ./patient-portal.Dockerfile \
            --build-arg GIT_SHA="${GIT_SHA}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --push \
            .

      - name: Build and push linkham portal image
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/clinicflow-linkham-portal
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          SHORT_SHA="$(echo "${GIT_SHA}" | cut -c1-12)"
          docker buildx build \
            --platform linux/amd64 \
            --file ./linkham-portal.Dockerfile \
            --build-arg GIT_SHA="${GIT_SHA}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --push \
            .
